<script>
/* ================= SETTINGS ================= */
const R = 314;                          // ball radius (SVG units)
const NICE_HOME = {x: 944, y: 467};     // ball centres from your Figma design
const MEAN_HOME = {x: 468, y: 901};    // where mean is drawn in Figma (origin for its transform)
const CORNER_INSET = 110;               // detention corner: bottom-left of the screen; bigger = more of the ball visible
const ANNOY_DELAY = 3;                  // seconds of hovering nice before mean gets annoyed and chases
const BPM = 72;                         // tempo of the bobbing: match to the song
const NICE_VOL = 0.9, MEAN_VOL = 0.6;

/* ================= SETUP ================= */
const svg = document.getElementById('stage');
const niceEl = document.getElementById('nice'), meanEl = document.getElementById('mean');
const noiseEl = document.getElementById('meanNoise');
const gate = document.getElementById('gate');

const mkAudio = src => { const a = new Audio(src); a.loop = true; a.preload = 'auto'; a.volume = 0; return a; };
const niceSong = mkAudio('audio/morning-mood.mp3');
const meanSong = mkAudio('audio/brown-noise.mp3');

// browsers only allow sound after a click: the gate provides it
gate.addEventListener('click', () => {
  [niceSong, meanSong].forEach(a => a.play().then(() => a.pause()).catch(() => {}));
  gate.classList.add('gone');
}, {once: true});

// pointer position (client px); null when pointer is not on the page
let ptr = null;
addEventListener('pointermove', e => ptr = {x: e.clientX, y: e.clientY});
addEventListener('pointerdown', e => ptr = {x: e.clientX, y: e.clientY});
document.addEventListener('pointerleave', () => ptr = null);
addEventListener('pointerup', e => { if (e.pointerType === 'touch') ptr = null; });
addEventListener('pointercancel', () => ptr = null);

function cursorInSvg() {
  if (!ptr) return null;
  const r = svg.getBoundingClientRect();
  return { x: 4 + (ptr.x - r.left) / r.width * 1440, y: (ptr.y - r.top) / r.height * 2066 };
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ================= STATE ================= */
let driftT = 0;                         // nice's wandering clock (frozen while hovered)
let hb = 0;                             // 0..1 blend: how "hovered" nice is (smooth transitions)
let push = {x: 0, y: 0};                // displacement mean has shoved nice by
let mean = null;                        // set on first frame (starts in the corner)
let hoverTime = 0;                      // how long nice has been hovered
let chaseUntil = 0, nextTwitch = 0, twitch = {x: 0, y: 0}, lastSeed = 0;
let last = performance.now();

function fade(audio, target, dt, playing) {
  if (playing && audio.paused) audio.play().catch(() => {});
  audio.volume = clamp(audio.volume + (target - audio.volume) * Math.min(1, dt * 4), 0, 1);
  if (!playing && audio.volume < 0.01 && !audio.paused) audio.pause();
}

/* ================= LOOP ================= */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const c = cursorInSvg();
  const sr = svg.getBoundingClientRect();
  const corner = { x: 4 + CORNER_INSET, y: (innerHeight - sr.top) / sr.height * 2066 - CORNER_INSET };  // follows the screen's bottom-left as you scroll
  if (!mean) mean = {x: corner.x, y: corner.y};

  // mean sits on top, so it wins when both are under the cursor
  const meanHover = !!c && dist(c, mean) < R;
  const niceCentre = niceEl._pos || NICE_HOME;
  const niceHover = !!c && !meanHover && dist(c, niceCentre) < R;

  /* ---- nice: free wandering, freezes + bobs to the beat on hover ---- */
  hb += ((niceHover ? 1 : 0) - hb) * Math.min(1, dt * 6);
  driftT += dt * (1 - hb);
  const t = driftT;
  let nx = NICE_HOME.x + Math.sin(t*.37)*130 + Math.sin(t*.91+1.3)*55;
  let ny = NICE_HOME.y + Math.cos(t*.29+.5)*110 + Math.sin(t*.73)*45;

  /* ---- mean: tiny idle shiver; frantic chase while nice is hovered ---- */
  hoverTime = niceHover ? hoverTime + dt : 0;
  const annoyed = hoverTime > ANNOY_DELAY;
  if (annoyed) chaseUntil = now + 700;
  const chasing = now < chaseUntil && c && !meanHover;
  // before the delay is up, mean starts to fidget more and more
  const fidget = niceHover && !annoyed ? Math.max(0, hoverTime - 0.8) / (ANNOY_DELAY - 0.8) : 0;
  if (chasing) {
    if (now > nextTwitch) { twitch = {x: (Math.random()-.5)*34, y: (Math.random()-.5)*34}; nextTwitch = now + 70 + Math.random()*90; }
    const k = Math.min(1, dt * 2.2);                       // creeps closer and closer
    mean.x += (c.x - mean.x) * k + twitch.x * dt * 12;
    mean.y += (c.y - mean.y) * k + twitch.y * dt * 12;
    if (now - lastSeed > 80) { noiseEl.setAttribute('seed', Math.floor(Math.random()*9999)); lastSeed = now; }
  } else if (!meanHover) {
    const k = Math.min(1, dt * 1.6);                       // drift back to the corner
    const a = 4 + fidget * 14;                            // tiny sulking motion, growing as it gets irritated
    mean.x += (corner.x + Math.sin(now/230)*a - mean.x) * k;
    mean.y += (corner.y + Math.cos(now/190)*a - mean.y) * k;
  } else {
    mean.x += (Math.random()-.5)*1.2; mean.y += (Math.random()-.5)*1.2;  // hovered: stays put, trembles
  }

  /* ---- mean shoves nice ---- */
  push.x *= Math.exp(-dt * .5); push.y *= Math.exp(-dt * .5);
  const minD = R * 2 * .9;
  const dx = nx + push.x - mean.x, dy = ny + push.y - mean.y, d = Math.hypot(dx, dy) || 1;
  if (d < minD) { const o = (minD - d) * Math.min(1, dt * 9); push.x += dx / d * o; push.y += dy / d * o; }
  nx = clamp(nx + push.x, 120, 1324); ny = clamp(ny + push.y, 120, 1946);
  niceEl._pos = {x: nx, y: ny};

  /* ---- bob in rhythm with the song (phase read from the audio clock) ---- */
  const phase = (niceSong.paused ? now/1000 : niceSong.currentTime) * BPM / 60;
  const bob = Math.sin(phase * Math.PI * 2) * hb;
  const sy = 1 + bob * .035, sx = 1 - bob * .02;
  niceEl.setAttribute('transform',
    `translate(${nx - NICE_HOME.x} ${ny - NICE_HOME.y + bob * -22}) translate(${NICE_HOME.x} ${NICE_HOME.y}) scale(${sx} ${sy}) translate(${-NICE_HOME.x} ${-NICE_HOME.y})`);
  meanEl.setAttribute('transform', `translate(${mean.x - MEAN_HOME.x} ${mean.y - MEAN_HOME.y})`);

  /* ---- sound ---- */
  if (!gate.classList.contains('gone')) { niceSong.volume = meanSong.volume = 0; }
  else { fade(niceSong, niceHover ? NICE_VOL : 0, dt, niceHover); fade(meanSong, meanHover ? MEAN_VOL : 0, dt, meanHover); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
